name: PMv2 Build Check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Smoke test production routes
        run: |
          npm start > /tmp/pmv2.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          curl -fsS http://127.0.0.1:3000/store >/dev/null
          curl -fsS http://127.0.0.1:3000/store/gang >/dev/null
          curl -fsS http://127.0.0.1:3000/join >/dev/null
          curl -fsS http://127.0.0.1:3000/rules >/dev/null
          curl -fsS http://127.0.0.1:3000/status >/dev/null
          curl -fsS http://127.0.0.1:3000/api/store >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/admin)" = "404"
